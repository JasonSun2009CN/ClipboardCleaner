# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: xcodebuild -project ClipboardCleaner.xcodeproj -scheme ClipboardCleaner -configuration Debug -derivedDataPath "$RUNNER_TEMP/DerivedData" build
    - name: Run tests
      run: xcodebuild -project ClipboardCleaner.xcodeproj -scheme ClipboardCleaner -configuration Debug -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" test
